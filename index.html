<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قنوات الجوكر الرسمية 2026</title>
    <style>
        :root {
            --bg-dark: #0f0f1a;
            --accent-green: #25d366;
            --accent-purple: #8e44ad;
            --text-main: #ffffff;
            --card-glass: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 500px;
            width: 100%;
        }

        header {
            text-align: center;
            padding: 20px 0;
        }

        .logo {
            font-size: 2.5rem;
            margin: 0;
            background: linear-gradient(to right, #25d366, #8e44ad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: bold;
        }

        .channel-list {
            display: grid;
            gap: 30px; /* مسافة بين القنوات */
            margin-top: 20px;
        }

        .channel-card {
            background: var(--card-glass);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 25px;
            padding: 20px;
            text-align: center; /* توسيط المحتوى */
            text-decoration: none;
            color: white;
            transition: 0.3s ease;
            display: block;
        }

        .channel-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--accent-green);
        }

        /* تعديل الصورة لتكون كبيرة وفي المنتصف */
        .channel-img {
            width: 120px; 
            height: 120px;
            border-radius: 20px;
            object-fit: cover;
            border: 3px solid var(--accent-green);
            margin-bottom: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .channel-name {
            font-size: 1.3rem;
            font-weight: bold;
            margin: 10px 0;
            display: block;
        }

        /* زر اضغط للانضمام أسفل الصورة */
        .join-btn {
            display: inline-block;
            background: var(--accent-green);
            color: #000;
            padding: 8px 25px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-top: 10px;
            transition: 0.3s;
        }

        .channel-card:hover .join-btn {
            background: #fff;
            transform: scale(1.1);
        }

        .footer {
            margin-top: 50px;
            text-align: center;
            padding: 20px;
            font-size: 0.9rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1 class="logo">الجوكر - Joker</h1>
        </header>

        <div class="channel-list">
            
            <a href="https://whatsapp.com/channel/0029VaFDOVyGE56kJdojZ21y" class="channel-card">
                <img src="555.jpg" alt="نكت وصور" class="channel-img">
                <span class="channel-name">ملصقات مضحكة</span>
                <div class="join-btn">اضغط للانضمام ⚡</div>
            </a>

            <a href="https://whatsapp.com/channel/0029VaetYGr2P59nEFQQDN2y" class="channel-card">
                <img src="222.jpg" alt="نكت وملصقات" class="channel-img">
                <span class="channel-name">نكت وملصقات مضحكة</span>
                <div class="join-btn">اضغط للانضمام 🎡</div>
            </a>

            <a href="https://whatsapp.com/channel/0029Vah9yu64SpkPw5bheK2w" class="channel-card">
                <img src="333.jpg" alt="عالم الحزن" class="channel-img">
                <span class="channel-name">عالم الحزن</span>
                <div class="join-btn">اضغط للانضمام 🖤</div>
            </a>

            <a href="https://whatsapp.com/channel/0029Vag9IXyFnSz36S2Q2L2r" class="channel-card">
                <img src="444.jpg" alt="عالم الحب" class="channel-img">
                <span class="channel-name">عالم الحب والعشق</span>
                <div class="join-btn">اضغط للانضمام 🎀</div>
            </a>

            <a href="https://whatsapp.com/channel/0029VaM22Q1GZNCs342ZUL3q" class="channel-card">
                <img src="111.png" alt="كبرياء وغرور" class="channel-img">
                <span class="channel-name">كبرياء رجل وغرور أنثى</span>
                <div class="join-btn">اضغط للانضمام 🔥</div>
            </a>

            <a href="https://whatsapp.com/channel/0029VajEuafBKfi6URrMh93y" class="channel-card">
                <img src="666.jpg" alt="ملصقات منوعة" class="channel-img">
                <span class="channel-name">ملصقات منوعة - Love</span>
                <div class="join-btn">اضغط للانضمام 🎧</div>
            </a>

        </div>

        <div class="footer">
            <p>جميع الحقوق محفوظة للجوكر © 2026</p>
        </div>
    </div>

</body>
</html>
